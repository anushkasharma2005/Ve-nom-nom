[project]
name = "snake-classifier-backend"
version = "1.0.0"
description = "FastAPI backend for venomous snake classification"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",      # required for FastAPI file uploads
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "Pillow>=10.3.0",
    "google-generativeai>=0.7.0",
    "pydantic>=2.7.0",
    "huggingface_hub>=0.18.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",    # for testing FastAPI with TestClient
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# uv-specific settings (optional)
index-url = "https://pypi.org/simple"


[tool.hatch.build.targets.wheel]
packages = ["snake_classifier_backend"]
